<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="インターネット無料の賃貸が遅い理由と対処法" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:1本の回線が全戸に分配され、細くなっていく様子 -->
  <g transform="translate(878, 286)">
    <path d="M8 34 L104 34" stroke="#ffd76a" stroke-width="20" stroke-linecap="round"/>
    <path d="M104 34 L206 34" stroke="#ffd76a" stroke-width="7" stroke-linecap="round"/>
    <path d="M104 34 Q150 34 206 100" stroke="#ffd76a" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M104 34 Q150 34 206 166" stroke="#ffd76a" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M104 34 Q150 34 206 232" stroke="#ffd76a" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="214" y="12" width="72" height="44" rx="7" fill="#ffffff"/>
    <rect x="214" y="78" width="72" height="44" rx="7" fill="#dbe7fb"/>
    <rect x="214" y="144" width="72" height="44" rx="7" fill="#dbe7fb"/>
    <rect x="214" y="210" width="72" height="44" rx="7" fill="#9fc1f5"/>
    <circle cx="56" cy="34" r="4" fill="#0b2c5f" opacity=".5"/>
  </g>

  <rect x="70" y="80" width="316" height="56" rx="28" fill="#ffd76a"/>
  <text x="228" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">夜だけ遅いのはなぜ</text>

  <text x="70" y="248" font-size="66" font-weight="800" fill="#ffffff">インターネット無料の</text>
  <text x="70" y="352" font-size="72" font-weight="800" fill="#ffd76a">賃貸が遅い理由</text>
  <text x="70" y="432" font-size="31" font-weight="600" fill="#cfe0ff">仕組みを知れば、打つべき手が決まります</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
