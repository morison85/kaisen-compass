<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="格安SIMおすすめ5社比較" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:スマホとSIM -->
  <g transform="translate(900, 250) scale(0.8)">
    <rect x="30" y="30" width="170" height="320" rx="28" fill="#ffffff"/>
    <rect x="46" y="66" width="138" height="230" rx="10" fill="#eaf1fd"/>
    <circle cx="115" cy="330" r="14" fill="#c9d6e8"/>
    <g transform="translate(60,90)">
      <rect x="0" y="30" width="24" height="90" rx="4" fill="#d64545" opacity=".8"/>
      <rect x="42" y="70" width="24" height="50" rx="4" fill="#9fc1f5"/>
      <rect x="84" y="95" width="24" height="25" rx="4" fill="#0e9f6e"/>
      <path d="M6 12 L96 78" stroke="#0b2c5f" stroke-width="7" stroke-linecap="round"/>
      <path d="M78 66 L96 78 L88 56" fill="none" stroke="#0b2c5f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M215 200 h70 a12 12 0 0 1 12 12 v86 a12 12 0 0 1-12 12 h-88 a12 12 0 0 1-12-12 v-68 z" fill="#ffd76a"/>
    <rect x="205" y="238" width="52" height="40" rx="7" fill="#d9a521"/>
  </g>

  <rect x="70" y="80" width="292" height="56" rx="28" fill="#ffd76a"/>
  <text x="216" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">乗り換え手順つき</text>

  <text x="70" y="248" font-size="80" font-weight="800" fill="#ffffff">格安SIM</text>
  <text x="70" y="360" font-size="80" font-weight="800" fill="#ffffff"><tspan fill="#ffd76a">5社</tspan>を比較</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">スマホ代を月3,000円下げる乗り換え術</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
