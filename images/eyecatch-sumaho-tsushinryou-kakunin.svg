<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="スマホの通信量はキャリアで見る。iPhoneの数字は累計" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右側: スマホと月別の棒グラフ(x=880〜1140) -->
  <g transform="translate(880,120)">
    <rect x="0" y="0" width="260" height="380" rx="36" fill="#ffffff"/>
    <rect x="100" y="16" width="60" height="8" rx="4" fill="#c9d4e4"/>
    <text x="130" y="70" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2c5f">月ごとの利用量</text>
    <path d="M30 300 H230" stroke="#c9d4e4" stroke-width="3" stroke-linecap="round"/>
    <rect x="44" y="214" width="40" height="86" rx="6" fill="#8fb3f0"/>
    <rect x="110" y="120" width="40" height="180" rx="6" fill="#1558d6"/>
    <rect x="176" y="190" width="40" height="110" rx="6" fill="#8fb3f0"/>
    <text x="64" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#5f6b7a">7月</text>
    <text x="130" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#5f6b7a">8月</text>
    <text x="196" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#5f6b7a">9月</text>
    <text x="130" y="108" text-anchor="middle" font-size="20" font-weight="800" fill="#d64545">最大月</text>
    <text x="130" y="362" text-anchor="middle" font-size="16" font-weight="700" fill="#0e9f6e">ここに容量を合わせる</text>
  </g>

  <!-- バッジ: 「iPhoneの数字は累計」半角6×14.5=87+全角6×29=174 → 261+60=321 -->
  <rect x="70" y="80" width="321" height="56" rx="28" fill="#ffd76a"/>
  <text x="230" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">iPhoneの数字は累計</text>

  <!-- 見出し: 「スマホの通信量は」8×74=592 → 右端662 / 「キャリアで見る」7×74=518。スマホ図は x=880 から -->
  <text x="70" y="248" font-size="74" font-weight="800" fill="#ffffff">スマホの通信量は</text>
  <text x="70" y="360" font-size="74" font-weight="800" fill="#ffffff"><tspan fill="#ffd76a">キャリア</tspan>で見る</text>
  <!-- サブ: 半角1×15.5+全角14×31=450 → 右端520 -->
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">3か月の最大月でプランを決める</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
