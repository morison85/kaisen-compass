<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="家族のスマホ・PCに有料のセキュリティソフトは要るか、端末別の判定" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:ノートPC・スマホと盾 -->
  <g transform="translate(900, 340) scale(0.9)">
    <rect x="0" y="70" width="170" height="110" rx="10" fill="#ffffff"/>
    <rect x="12" y="82" width="146" height="86" rx="4" fill="#c3d7f7"/>
    <rect x="-16" y="180" width="202" height="16" rx="8" fill="#ffffff"/>
    <rect x="190" y="110" width="60" height="110" rx="10" fill="#ffffff"/>
    <rect x="198" y="122" width="44" height="78" rx="3" fill="#c3d7f7"/>
    <circle cx="220" cy="210" r="4" fill="#0b2c5f"/>
    <path d="M150 0 L214 24 V78 C214 120 186 150 150 164 C114 150 86 120 86 78 V24 Z" fill="#ffd76a"/>
    <path d="M122 82 L143 103 L180 62" fill="none" stroke="#0b2c5f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="70" y="80" width="300" height="56" rx="28" fill="#ffd76a"/>
  <text x="220" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">OS標準で足りる?</text>

  <text x="70" y="248" font-size="80" font-weight="800" fill="#ffffff">家族のスマホ・PCに</text>
  <text x="70" y="360" font-size="80" font-weight="800" fill="#ffd76a">有料ソフトは要る?</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">端末別の判定表・台数の数え方・年額の目安</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
