<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="WiMAXのホームルーターとモバイルルーターの選び分け" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:ホームルーター(左)とモバイルルーター(右) -->
  <g transform="translate(880, 300)">
    <rect x="10" y="40" width="96" height="180" rx="16" fill="#ffffff"/>
    <rect x="30" y="66" width="56" height="10" rx="5" fill="#9fc1f5"/>
    <circle cx="58" cy="150" r="20" fill="#dbe7fb"/>
    <circle cx="58" cy="150" r="7" fill="#1558d6"/>
    <rect x="160" y="118" width="86" height="102" rx="12" fill="#ffd76a"/>
    <rect x="178" y="140" width="50" height="34" rx="5" fill="#0b2c5f"/>
    <circle cx="203" cy="196" r="8" fill="#0b2c5f"/>
    <path d="M-6 24 q28 -30 56 0" fill="none" stroke="#ffd76a" stroke-width="8" stroke-linecap="round"/>
    <path d="M-26 44 q48 -52 96 0" fill="none" stroke="#ffd76a" stroke-width="8" stroke-linecap="round" opacity=".6"/>
  </g>

  <rect x="70" y="80" width="336" height="56" rx="28" fill="#ffd76a"/>
  <text x="238" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">判断軸はたった一つ</text>

  <text x="70" y="248" font-size="80" font-weight="800" fill="#ffffff">WiMAXは</text>
  <text x="70" y="352" font-size="72" font-weight="800" fill="#ffd76a">ホーム型?モバイル型?</text>
  <text x="70" y="432" font-size="31" font-weight="600" fill="#cfe0ff">持ち出さないなら、答えは決まっています</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
