<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="戸建ての光回線おすすめ比較" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:一戸建てと光ファイバー -->
  <g transform="translate(880, 320) scale(0.9)">
    <path d="M30 130 L150 40 L270 130" fill="none" stroke="#ffd76a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="60" y="130" width="180" height="120" rx="8" fill="#ffffff"/>
    <rect x="95" y="170" width="44" height="44" rx="6" fill="#9fc1f5"/>
    <rect x="165" y="170" width="44" height="80" rx="6" fill="#dbe7fb"/>
    <path d="M-40 250 Q10 200 60 236" fill="none" stroke="#ffd76a" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 18"/>
  </g>

  <rect x="70" y="80" width="292" height="56" rx="28" fill="#ffd76a"/>
  <text x="216" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">全選択肢から選べる</text>

  <text x="70" y="248" font-size="80" font-weight="800" fill="#ffffff">戸建ての光回線</text>
  <text x="70" y="360" font-size="78" font-weight="800" fill="#ffd76a">おすすめ比較</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">独自回線が本命になれる、唯一の住まい</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
