<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="光回線キャンペーン比較。キャッシュバックはいつもらえるか" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:受取月に丸をつけたカレンダーとコイン -->
  <g transform="translate(890, 330) scale(0.9)">
    <rect x="0" y="20" width="220" height="200" rx="16" fill="#ffffff"/>
    <rect x="0" y="20" width="220" height="48" rx="16" fill="#ffd76a"/>
    <rect x="0" y="50" width="220" height="18" fill="#ffd76a"/>
    <rect x="44" y="4" width="14" height="36" rx="7" fill="#0b2c5f"/>
    <rect x="162" y="4" width="14" height="36" rx="7" fill="#0b2c5f"/>
    <g fill="#cfe0ff">
      <rect x="22" y="88" width="34" height="28" rx="5"/><rect x="68" y="88" width="34" height="28" rx="5"/><rect x="114" y="88" width="34" height="28" rx="5"/><rect x="160" y="88" width="34" height="28" rx="5"/>
      <rect x="22" y="130" width="34" height="28" rx="5"/><rect x="68" y="130" width="34" height="28" rx="5"/><rect x="160" y="130" width="34" height="28" rx="5"/>
      <rect x="22" y="172" width="34" height="28" rx="5"/><rect x="68" y="172" width="34" height="28" rx="5"/><rect x="114" y="172" width="34" height="28" rx="5"/><rect x="160" y="172" width="34" height="28" rx="5"/>
    </g>
    <rect x="114" y="130" width="34" height="28" rx="5" fill="#1558d6"/>
    <circle cx="131" cy="144" r="26" fill="none" stroke="#e5484d" stroke-width="6"/>
    <circle cx="232" cy="222" r="44" fill="#ffd76a"/>
    <circle cx="232" cy="222" r="33" fill="none" stroke="#0b2c5f" stroke-width="5"/>
    <text x="232" y="236" text-anchor="middle" font-size="40" font-weight="800" fill="#0b2c5f">¥</text>
  </g>

  <rect x="70" y="80" width="400" height="56" rx="28" fill="#ffd76a"/>
  <text x="270" y="119" text-anchor="middle" font-size="28" font-weight="800" fill="#0b2c5f">2026年秋・受取カレンダー</text>

  <text x="70" y="248" font-size="78" font-weight="800" fill="#ffffff">光回線キャンペーン</text>
  <text x="70" y="360" font-size="78" font-weight="800" fill="#ffd76a">いつもらえる？</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">金額より受取月で比べる6社早見表</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
