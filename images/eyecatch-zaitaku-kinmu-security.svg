  <rect x="70" y="80" width="360" height="56" rx="28" fill="#ffd76a"/>
  <text x="250" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">VPNだけでは守れない</text>

  <text x="70" y="248" font-size="80" font-weight="800" fill="#ffffff">在宅勤務のセキュリティ</text>
  <text x="70" y="360" font-size="80" font-weight="800" fill="#ffd76a">自宅回線の7つの確認</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">ルーター設定・ゲストWi-Fi・JC-STARラベル</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
