<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ドコモhome 5Gのエリア確認方法と地図の色の読み方" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:エリアマップとピン -->
  <g transform="translate(890, 330) scale(0.9)">
    <rect x="10" y="60" width="250" height="200" rx="18" fill="#ffffff"/>
    <path d="M10 190 C 70 150, 120 220, 180 176 C 216 150, 244 166, 260 158" fill="none" stroke="#d7e3f5" stroke-width="10" stroke-linecap="round"/>
    <circle cx="96" cy="150" r="58" fill="#9fc1f5" opacity=".55"/>
    <circle cx="180" cy="196" r="40" fill="#ffd76a" opacity=".45"/>
    <g transform="translate(112,86)">
      <path d="M32 0 C 50 0 64 14 64 32 C 64 56 32 92 32 92 C 32 92 0 56 0 32 C 0 14 14 0 32 0 Z" fill="#d64545"/>
      <circle cx="32" cy="32" r="14" fill="#ffffff"/>
    </g>
    <text x="135" y="248" text-anchor="middle" font-size="24" font-weight="800" fill="#0b2c5f">色は屋外の目安</text>
  </g>

  <rect x="70" y="80" width="263" height="56" rx="28" fill="#ffd76a"/>
  <text x="201" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">地図の見方から</text>

  <text x="70" y="248" font-size="74" font-weight="800" fill="#ffffff"><tspan fill="#ffd76a">home 5G</tspan>のエリア確認</text>
  <text x="70" y="360" font-size="74" font-weight="800" fill="#ffffff">地図の色に注意</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">機種選択・実地チェック・8日以内キャンセル</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
