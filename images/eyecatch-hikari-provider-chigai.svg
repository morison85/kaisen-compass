<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="光回線とプロバイダの違いを図解で整理" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:家 → 回線 → インターネットの3段構成 -->
  <g transform="translate(890, 335) scale(0.9)">
    <path d="M20 195 L80 145 L140 195 V290 H20 Z" fill="#ffffff"/>
    <rect x="62" y="230" width="36" height="60" rx="4" fill="#9fc1f5"/>
    <path d="M155 240 H205" stroke="#ffd76a" stroke-width="12" stroke-linecap="round"/>
    <rect x="215" y="200" width="90" height="80" rx="12" fill="#ffffff"/>
    <circle cx="240" cy="262" r="7" fill="#1558d6"/>
    <circle cx="262" cy="262" r="7" fill="#1558d6"/>
    <path d="M240 228 V214" stroke="#0b2c5f" stroke-width="8" stroke-linecap="round"/>
    <path d="M280 228 V196" stroke="#0b2c5f" stroke-width="8" stroke-linecap="round"/>
    <circle cx="285" cy="120" r="50" fill="#ffd76a"/>
    <ellipse cx="285" cy="120" rx="50" ry="20" fill="none" stroke="#0b2c5f" stroke-width="6"/>
    <path d="M285 70 V170 M235 120 H335" stroke="#0b2c5f" stroke-width="6"/>
    <path d="M255 172 L272 198" stroke="#ffd76a" stroke-width="12" stroke-linecap="round"/>
  </g>

  <rect x="70" y="80" width="316" height="56" rx="28" fill="#ffd76a"/>
  <text x="228" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">契約は3パターンだけ</text>

  <text x="70" y="248" font-size="80" font-weight="800" fill="#ffffff">光回線と</text>
  <text x="70" y="360" font-size="80" font-weight="800" fill="#ffd76a">プロバイダの違い</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">自分がどの契約かを5分で判定するチェック付き</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
