<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="光回線の工事待ちは何週間かかるのか。混雑カレンダーと逆算スケジュール" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:カレンダーと時計のイラスト -->
  <g transform="translate(890, 330) scale(0.9)">
    <rect x="10" y="40" width="230" height="200" rx="16" fill="#ffffff"/>
    <rect x="10" y="40" width="230" height="46" rx="16" fill="#9fc1f5"/>
    <rect x="10" y="74" width="230" height="12" fill="#9fc1f5"/>
    <rect x="52" y="24" width="16" height="36" rx="8" fill="#cfe0ff"/>
    <rect x="182" y="24" width="16" height="36" rx="8" fill="#cfe0ff"/>
    <g fill="#c9d8f2">
      <rect x="36" y="106" width="30" height="24" rx="5"/>
      <rect x="82" y="106" width="30" height="24" rx="5"/>
      <rect x="128" y="106" width="30" height="24" rx="5"/>
      <rect x="174" y="106" width="30" height="24" rx="5"/>
      <rect x="36" y="146" width="30" height="24" rx="5"/>
      <rect x="82" y="146" width="30" height="24" rx="5"/>
    </g>
    <circle cx="176" cy="192" r="58" fill="#ffd76a"/>
    <circle cx="176" cy="192" r="46" fill="#ffffff"/>
    <path d="M176 158 V192 L202 208" fill="none" stroke="#0b2c5f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="70" y="80" width="307" height="56" rx="28" fill="#ffd76a"/>
  <text x="223" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">年2回の繁忙期あり</text>

  <text x="70" y="248" font-size="80" font-weight="800" fill="#ffffff">光回線の工事待ち</text>
  <text x="70" y="360" font-size="80" font-weight="800" fill="#ffd76a">何週間かかる?</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">混雑カレンダーと逆算スケジュール</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
