<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="eo光の評判と料金、2つのプランを比較" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:家と光ファイバー、2つの料金カード -->
  <g transform="translate(880, 330) scale(0.9)">
    <path d="M-20 222 C40 170 70 200 110 150" fill="none" stroke="#ffd76a" stroke-width="7" stroke-linecap="round"/>
    <path d="M110 92 L190 30 L270 92 V222 H110 Z" fill="#ffffff"/>
    <rect x="150" y="140" width="40" height="82" rx="4" fill="#c3d7f7"/>
    <rect x="212" y="120" width="38" height="34" rx="4" fill="#c3d7f7"/>
    <rect x="262" y="0" width="70" height="90" rx="8" fill="#ffd76a"/>
    <rect x="274" y="16" width="46" height="8" rx="4" fill="#0b2c5f"/>
    <rect x="274" y="34" width="34" height="8" rx="4" fill="#0b2c5f" opacity=".6"/>
    <rect x="296" y="56" width="70" height="90" rx="8" fill="#ffffff"/>
    <rect x="308" y="72" width="46" height="8" rx="4" fill="#1558d6"/>
    <rect x="308" y="90" width="34" height="8" rx="4" fill="#1558d6" opacity=".6"/>
  </g>

  <rect x="70" y="80" width="300" height="56" rx="28" fill="#ffd76a"/>
  <text x="220" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">関西の独自回線</text>

  <text x="70" y="248" font-size="80" font-weight="800" fill="#ffffff">eo光の評判と料金</text>
  <text x="70" y="360" font-size="80" font-weight="800" fill="#ffd76a">2つのプランを比較</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">ネットのみと電話セット、36か月総額の分かれ目</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
