<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="LINEMOの乗り換え特典条件の読み方" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:カレンダーと後払いのポイント -->
  <g transform="translate(900, 330) scale(0.9)">
    <rect x="10" y="60" width="230" height="190" rx="16" fill="#ffffff"/>
    <rect x="10" y="60" width="230" height="48" rx="16" fill="#9fc1f5"/>
    <rect x="10" y="92" width="230" height="16" fill="#9fc1f5"/>
    <circle cx="58" cy="52" r="10" fill="#cfe0ff"/>
    <circle cx="192" cy="52" r="10" fill="#cfe0ff"/>
    <rect x="52" y="34" width="12" height="34" rx="6" fill="#cfe0ff"/>
    <rect x="186" y="34" width="12" height="34" rx="6" fill="#cfe0ff"/>
    <g fill="#d7e3f5">
      <rect x="34" y="128" width="30" height="24" rx="5"/>
      <rect x="76" y="128" width="30" height="24" rx="5"/>
      <rect x="118" y="128" width="30" height="24" rx="5"/>
      <rect x="160" y="128" width="30" height="24" rx="5"/>
      <rect x="34" y="164" width="30" height="24" rx="5"/>
      <rect x="76" y="164" width="30" height="24" rx="5"/>
    </g>
    <circle cx="163" cy="188" r="34" fill="#ffd76a"/>
    <text x="163" y="205" text-anchor="middle" font-size="38" font-weight="800" fill="#0b2c5f">¥</text>
    <text x="125" y="238" text-anchor="middle" font-size="24" font-weight="800" fill="#0b2c5f">約7ヶ月後</text>
  </g>

  <rect x="70" y="80" width="234" height="56" rx="28" fill="#ffd76a"/>
  <text x="187" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">条件の読み方</text>

  <text x="70" y="248" font-size="74" font-weight="800" fill="#ffffff"><tspan fill="#ffd76a">LINEMO</tspan>乗り換え</text>
  <text x="70" y="360" font-size="74" font-weight="800" fill="#ffffff">特典条件の読み方</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">もらえる時期と失効ルールを先に整理</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
