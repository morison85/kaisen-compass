    <rect x="20" y="60" width="250" height="52" rx="16" fill="#9fc1f5"/>
    <rect x="20" y="96" width="250" height="16" fill="#9fc1f5"/>
    <rect x="72" y="38" width="20" height="44" rx="10" fill="#cfe0ff"/>
    <rect x="198" y="38" width="20" height="44" rx="10" fill="#cfe0ff"/>
    <g fill="#c7d7f2">
