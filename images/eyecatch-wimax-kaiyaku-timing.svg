      <rect x="92" y="134" width="30" height="24" rx="6"/>
      <rect x="138" y="134" width="30" height="24" rx="6"/>
      <rect x="184" y="134" width="30" height="24" rx="6"/>
      <rect x="46" y="176" width="30" height="24" rx="6"/>
      <rect x="138" y="176" width="30" height="24" rx="6"/>
      <rect x="184" y="176" width="30" height="24" rx="6"/>
      <rect x="46" y="218" width="30" height="24" rx="6"/>
      <rect x="92" y="218" width="30" height="24" rx="6"/>
      <rect x="138" y="218" width="30" height="24" rx="6"/>
