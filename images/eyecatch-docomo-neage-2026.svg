<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ドコモの値上げはいつから。eximo・irumoの改定額と乗り換えの損得" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:改定額 -->
  <g transform="translate(880, 330)">
    <rect x="0" y="0" width="240" height="226" rx="16" fill="#ffffff"/>
    <text x="120" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="#0b2c5f">eximo</text>
    <text x="120" y="102" text-anchor="middle" font-size="42" font-weight="800" fill="#1558d6">+550円</text>
    <rect x="30" y="120" width="180" height="3" fill="#cfe0ff"/>
    <text x="120" y="164" text-anchor="middle" font-size="26" font-weight="800" fill="#0b2c5f">irumo 3GB</text>
    <text x="120" y="210" text-anchor="middle" font-size="42" font-weight="800" fill="#1558d6">+330円</text>
  </g>

  <rect x="70" y="80" width="300" height="56" rx="28" fill="#ffd76a"/>
  <text x="220" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">2026年12月1日から</text>

  <text x="70" y="248" font-size="84" font-weight="800" fill="#ffffff">ドコモの値上げ</text>
  <text x="70" y="346" font-size="78" font-weight="800" fill="#ffd76a">いつからいくら?</text>
  <text x="70" y="426" font-size="34" font-weight="700" fill="#dbe7ff">主なプランの改定額を一覧に</text>
  <text x="70" y="476" font-size="34" font-weight="700" fill="#dbe7ff">対象外プランと乗り換えの損得</text>
  <text x="70" y="572" font-size="26" font-weight="700" fill="#9fc1f5">回線コンパス</text>
</svg>
