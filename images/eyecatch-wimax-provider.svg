<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="WiMAXプロバイダ比較" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:モバイルルーターと電波 -->
  <g transform="translate(900, 330) scale(0.9)">
    <rect x="40" y="100" width="200" height="120" rx="18" fill="#ffffff"/>
    <rect x="62" y="126" width="110" height="14" rx="7" fill="#9fc1f5"/>
    <rect x="62" y="152" width="80" height="14" rx="7" fill="#dbe7fb"/>
    <circle cx="206" cy="160" r="20" fill="#ffd76a"/>
    <path d="M100 70 Q140 30 180 70" fill="none" stroke="#ffd76a" stroke-width="12" stroke-linecap="round"/>
    <path d="M120 88 Q140 66 160 88" fill="none" stroke="#ffd76a" stroke-width="12" stroke-linecap="round"/>
  </g>

  <rect x="70" y="80" width="342" height="56" rx="28" fill="#ffd76a"/>
  <text x="241" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">速度は同じ・料金が違う</text>

  <text x="70" y="248" font-size="82" font-weight="800" fill="#ffffff">WiMAX</text>
  <text x="70" y="360" font-size="78" font-weight="800" fill="#ffd76a">プロバイダ比較</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">実質月額で選ぶ、損しない契約窓口</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
