<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="MNPワンストップは組み合わせで決まる。予約番号が要るケースと要らないケースの判定" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:2台のスマホの間を番号が移る -->
  <g transform="translate(885, 325) scale(0.9)">
    <rect x="0" y="20" width="112" height="196" rx="18" fill="#ffffff" opacity=".85"/>
    <rect x="12" y="42" width="88" height="146" rx="9" fill="#0b2c5f"/>
    <text x="56" y="126" text-anchor="middle" font-size="26" font-weight="800" fill="#9fc1f5">旧</text>
    <rect x="220" y="20" width="112" height="196" rx="18" fill="#ffffff"/>
    <rect x="232" y="42" width="88" height="146" rx="9" fill="#0b2c5f"/>
    <text x="276" y="126" text-anchor="middle" font-size="26" font-weight="800" fill="#ffd76a">新</text>
    <path d="M126 118 h72" stroke="#ffd76a" stroke-width="10" stroke-linecap="round"/>
    <path d="M182 104 l18 14 l-18 14" fill="none" stroke="#ffd76a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="104" y="24" width="124" height="46" rx="23" fill="#ffd76a"/>
    <text x="166" y="56" text-anchor="middle" font-size="24" font-weight="800" fill="#0b2c5f">1STOP</text>
  </g>

  <rect x="70" y="80" width="350" height="56" rx="28" fill="#ffd76a"/>
  <text x="245" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">対応事業者一覧つき</text>

  <text x="70" y="248" font-size="78" font-weight="800" fill="#ffffff">MNPワンストップは</text>
  <text x="70" y="360" font-size="78" font-weight="800" fill="#ffd76a">組み合わせで決まる</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">予約番号が要る/要らないを2軸で判定する</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
