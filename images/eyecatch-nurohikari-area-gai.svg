<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="NURO光がエリア外だったときの代替回線の選び方" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:エリア判定の地図ピンと迂回ルート -->
  <g transform="translate(880, 325) scale(0.9)">
    <rect x="30" y="110" width="300" height="200" rx="18" fill="#ffffff"/>
    <path d="M30 250 L110 195 L180 235 L260 175 L330 215" fill="none" stroke="#9fc1f5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 300 L140 300" stroke="#9fc1f5" stroke-width="10" stroke-linecap="round"/>
    <g transform="translate(215,120)">
      <path d="M45 0 C70 0 90 20 90 45 C90 78 45 120 45 120 C45 120 0 78 0 45 C0 20 20 0 45 0 Z" fill="#ffd76a"/>
      <circle cx="45" cy="45" r="18" fill="#0b2c5f"/>
    </g>
    <path d="M95 120 L155 60" stroke="#ffd76a" stroke-width="12" stroke-linecap="round"/>
    <path d="M128 60 L157 58 L155 88" fill="none" stroke="#ffd76a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="70" y="80" width="316" height="56" rx="28" fill="#ffd76a"/>
  <text x="228" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">エリア外は3種類ある</text>

  <text x="70" y="248" font-size="78" font-weight="800" fill="#ffffff">NURO光エリア外</text>
  <text x="70" y="360" font-size="78" font-weight="800" fill="#ffd76a">代替回線の選び方</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">速度で妥協しないための、地域別・代替マップ</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
