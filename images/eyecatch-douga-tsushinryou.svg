<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="動画配信サービスの画質別データ通信量の目安" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:動画プレイヤーとギガのゲージ -->
  <g transform="translate(890, 330) scale(0.9)">
    <rect x="10" y="40" width="270" height="160" rx="16" fill="#ffffff"/>
    <rect x="10" y="40" width="270" height="34" rx="16" fill="#9fc1f5"/>
    <rect x="10" y="58" width="270" height="16" fill="#9fc1f5"/>
    <circle cx="145" cy="140" r="46" fill="#1558d6"/>
    <polygon points="132,118 176,140 132,162" fill="#ffffff"/>
    <rect x="10" y="226" width="270" height="22" rx="11" fill="#ffffff" opacity=".35"/>
    <rect x="10" y="226" width="96" height="22" rx="11" fill="#ffd76a"/>
    <text x="290" y="244" font-size="26" font-weight="800" fill="#ffd76a">GB</text>
  </g>

  <rect x="70" y="80" width="234" height="56" rx="28" fill="#ffd76a"/>
  <text x="187" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">画質1段で3倍</text>

  <text x="70" y="248" font-size="82" font-weight="800" fill="#ffffff">動画1時間で</text>
  <text x="70" y="360" font-size="82" font-weight="800" fill="#ffd76a">何ギガ減る?</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">サービス別・画質別の早見表と最適プラン</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
