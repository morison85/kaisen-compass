<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="自宅のネットワークを仕事用・家族用・ゲストとIoT用の3つに分ける図。会社PCは有線かメインのWi-Fi、テレビやストリーミング端末、スマート家電はゲスト用Wi-Fiにつなぐ" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="56" text-anchor="middle" font-size="36" font-weight="800" fill="#0b2c5f">会社PCと家の機器は「つなぐ場所」を分ける</text>
  <text x="600" y="94" text-anchor="middle" font-size="22" fill="#5f6b7a">ゲスト用Wi-Fi(SSID)を使えば、ルーター1台でも分けられる</text>

  <rect x="430" y="126" width="340" height="96" rx="14" fill="#0b2c5f"/>
  <text x="600" y="166" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">Wi-Fiルーター</text>
  <text x="600" y="200" text-anchor="middle" font-size="17" fill="#cfe0ff">管理画面とファームウェアは自分で管理</text>

  <path d="M600 222 V256 M210 256 H990 M210 256 V290 M600 256 V290 M990 256 V290" fill="none" stroke="#c3d7f7" stroke-width="6" stroke-linecap="round"/>

  <g>
    <rect x="40" y="290" width="340" height="250" rx="14" fill="#eaf1fd" stroke="#1558d6" stroke-width="3"/>
    <rect x="40" y="290" width="340" height="56" rx="14" fill="#1558d6"/>
    <rect x="40" y="326" width="340" height="20" fill="#1558d6"/>
    <text x="210" y="328" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">仕事用</text>
    <text x="70" y="392" font-size="20" font-weight="700" fill="#0b2c5f">・会社PC(有線が理想)</text>
    <text x="70" y="432" font-size="20" font-weight="700" fill="#0b2c5f">・会社のVPNで社内へ</text>
    <text x="70" y="472" font-size="20" font-weight="700" fill="#0b2c5f">・私物は混ぜない</text>
    <text x="210" y="518" text-anchor="middle" font-size="17" fill="#5f6b7a">有線 または メインのWi-Fi</text>
  </g>

  <g>
    <rect x="430" y="290" width="340" height="250" rx="14" fill="#f3f6fa" stroke="#5f6b7a" stroke-width="3"/>
    <rect x="430" y="290" width="340" height="56" rx="14" fill="#5f6b7a"/>
    <rect x="430" y="326" width="340" height="20" fill="#5f6b7a"/>
    <text x="600" y="328" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">家族用</text>
    <text x="460" y="392" font-size="20" font-weight="700" fill="#0b2c5f">・家族のスマホ</text>
    <text x="460" y="432" font-size="20" font-weight="700" fill="#0b2c5f">・タブレット</text>
    <text x="460" y="472" font-size="20" font-weight="700" fill="#0b2c5f">・家族の私用PC</text>
    <text x="600" y="518" text-anchor="middle" font-size="17" fill="#5f6b7a">メインのWi-Fi</text>
  </g>

  <g>
    <rect x="820" y="290" width="340" height="250" rx="14" fill="#fff8e1" stroke="#d99a00" stroke-width="3"/>
    <rect x="820" y="290" width="340" height="56" rx="14" fill="#d99a00"/>
    <rect x="820" y="326" width="340" height="20" fill="#d99a00"/>
    <text x="990" y="328" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">ゲスト・IoT用</text>
    <text x="850" y="392" font-size="20" font-weight="700" fill="#0b2c5f">・テレビ・ゲーム機</text>
    <text x="850" y="432" font-size="20" font-weight="700" fill="#0b2c5f">・ストリーミング端末</text>
    <text x="850" y="472" font-size="20" font-weight="700" fill="#0b2c5f">・スマート家電・カメラ</text>
    <text x="990" y="518" text-anchor="middle" font-size="17" fill="#5f6b7a">ゲスト用Wi-Fi(分離あり)</text>
  </g>

  <text x="600" y="588" text-anchor="middle" font-size="18" fill="#5f6b7a">※ ゲスト用Wi-Fiから他の機器へ通信できない設定(分離機能)の有無と名称は機種ごとに異なる</text>
</svg>
