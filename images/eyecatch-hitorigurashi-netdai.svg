<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="一人暮らしのネット代の相場と、月5,000円台に収める構成" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右側: 家計簿カード(ビフォー→アフター) -->
  <g transform="translate(860,150)">
    <rect x="0" y="0" width="280" height="320" rx="22" fill="#ffffff"/>
    <text x="140" y="46" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2c5f">月々の通信費</text>
    <text x="30" y="110" font-size="18" font-weight="700" fill="#5f6b7a">大手スマホ+光回線</text>
    <text x="250" y="150" text-anchor="end" font-size="34" font-weight="800" fill="#d64545">約12,000円</text>
    <path d="M140 172 v34" stroke="#0e9f6e" stroke-width="6" stroke-linecap="round"/>
    <path d="M126 196 L140 212 L154 196" fill="none" stroke="#0e9f6e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="248" font-size="18" font-weight="700" fill="#5f6b7a">格安SIM+縛りなし光</text>
    <text x="250" y="290" text-anchor="end" font-size="34" font-weight="800" fill="#0e9f6e">5,000円台</text>
  </g>

  <!-- バッジ: 「相場と最安構成」7文字×29=203+60=263 -->
  <rect x="70" y="80" width="263" height="56" rx="28" fill="#ffd76a"/>
  <text x="201" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">相場と最安構成</text>

  <!-- 見出し: 「一人暮らしの」6×74=444 / 「ネット代を下げる」8×74=592 → 右端662 -->
  <text x="70" y="248" font-size="74" font-weight="800" fill="#ffffff">一人暮らしの</text>
  <text x="70" y="360" font-size="74" font-weight="800" fill="#ffffff"><tspan fill="#ffd76a">ネット代</tspan>を下げる</text>
  <!-- サブ: 20文字×31=620 -->
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">相場の見方と、月5,000円台に収める組み方</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
