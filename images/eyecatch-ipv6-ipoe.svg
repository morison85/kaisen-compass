<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="IPv6(IPoE)で夜の光回線が速くなる理由" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右側: 混雑する道(PPPoE)と空いている道(IPoE) -->
  <g transform="translate(850,150)">
    <rect x="0" y="0" width="290" height="330" rx="22" fill="#ffffff" opacity=".96"/>
    <text x="145" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2c5f">夜の混雑ポイント</text>
    <!-- PPPoE: 渋滞 -->
    <text x="26" y="92" font-size="18" font-weight="700" fill="#d64545">従来(PPPoE)</text>
    <rect x="26" y="104" width="238" height="44" rx="10" fill="#fdecec"/>
    <circle cx="52" cy="126" r="11" fill="#d64545"/><circle cx="80" cy="126" r="11" fill="#d64545"/><circle cx="108" cy="126" r="11" fill="#d64545"/><circle cx="136" cy="126" r="11" fill="#d64545"/><circle cx="164" cy="126" r="11" fill="#d64545"/>
    <rect x="196" y="108" width="14" height="36" rx="3" fill="#d64545"/>
    <text x="236" y="132" font-size="16" font-weight="700" fill="#d64545">渋滞</text>
    <!-- IPoE: 空いている -->
    <text x="26" y="196" font-size="18" font-weight="700" fill="#0e9f6e">IPv6(IPoE)</text>
    <rect x="26" y="208" width="238" height="44" rx="10" fill="#e6f7f0"/>
    <circle cx="52" cy="230" r="11" fill="#0e9f6e"/>
    <path d="M86 230 H238" stroke="#0e9f6e" stroke-width="6" stroke-linecap="round"/>
    <path d="M222 216 L240 230 L222 244" fill="none" stroke="#0e9f6e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="145" y="300" text-anchor="middle" font-size="17" font-weight="700" fill="#5f6b7a">混雑ポイントを通らない</text>
  </g>

  <!-- バッジ: 「図解でわかる」5文字×29=145+60=205 -->
  <rect x="70" y="80" width="205" height="56" rx="28" fill="#ffd76a"/>
  <text x="172" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">図解でわかる</text>

  <!-- 見出し: 「IPv6(IPoE)とは?」半角11+全角3 → 約 11×37+3×74=629 (右端699) / 「夜だけ遅い」を解決 = 10文字×74=740 (右端810 < 850) -->
  <text x="70" y="248" font-size="74" font-weight="800" fill="#ffffff"><tspan fill="#ffd76a">IPv6</tspan>(IPoE)とは?</text>
  <text x="70" y="360" font-size="74" font-weight="800" fill="#ffffff">「夜だけ遅い」を解決</text>
  <!-- サブ: 22文字×31=682 -->
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">速くなる仕組みと、切り替え手順・対応回線</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
