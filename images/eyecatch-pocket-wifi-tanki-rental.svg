<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ポケットWiFi短期レンタルの選び方。期間別の正解と料金の目安" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:モバイルルーター+カレンダーのイラスト -->
  <g transform="translate(890, 320) scale(0.9)">
    <rect x="40" y="60" width="130" height="220" rx="22" fill="#ffffff"/>
    <rect x="60" y="90" width="90" height="130" rx="8" fill="#dbe7ff"/>
    <circle cx="105" cy="250" r="10" fill="#1558d6"/>
    <g fill="none" stroke="#ffd76a" stroke-width="8" stroke-linecap="round">
      <path d="M180 130 A55 55 0 0 1 180 190"/>
      <path d="M200 110 A85 85 0 0 1 200 210"/>
    </g>
  </g>

  <rect x="70" y="80" width="300" height="56" rx="28" fill="#ffd76a"/>
  <text x="220" y="118" text-anchor="middle" font-size="26" font-weight="800" fill="#0b2c5f">1週間から借りられる</text>

  <text x="70" y="248" font-size="82" font-weight="800" fill="#ffffff">ポケットWiFi</text>
  <text x="70" y="360" font-size="82" font-weight="800" fill="#ffd76a">短期レンタル</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">期間別の正解と料金の目安</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
