<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="光回線を2年ごとに乗り換えるサイクル運用の損益分岐" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:サイクル(循環矢印)とカレンダー -->
  <g transform="translate(895, 330) scale(0.9)">
    <circle cx="140" cy="150" r="104" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="16"/>
    <path d="M140 46 A104 104 0 0 1 244 150" fill="none" stroke="#ffd76a" stroke-width="16" stroke-linecap="round"/>
    <polygon points="244,124 268,152 240,172" fill="#ffd76a"/>
    <rect x="76" y="96" width="128" height="112" rx="12" fill="#ffffff"/>
    <rect x="76" y="96" width="128" height="30" rx="12" fill="#9fc1f5"/>
    <text x="140" y="180" text-anchor="middle" font-size="52" font-weight="800" fill="#0b2c5f">2年</text>
  </g>

  <rect x="70" y="80" width="263" height="56" rx="28" fill="#ffd76a"/>
  <text x="201" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">5年総額で試算</text>

  <text x="70" y="248" font-size="74" font-weight="800" fill="#ffffff">2年ごとの乗り換えは</text>
  <text x="70" y="360" font-size="74" font-weight="800" fill="#ffd76a">本当に得か?</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">損益分岐は「工事費の分割完了月」で決まる</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
