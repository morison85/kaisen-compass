<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="サブ回線の格安SIMは年いくらで持てる?障害時に止まらない組み合わせ表" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:2枚のSIMと電波 -->
  <g transform="translate(890, 330) scale(0.9)">
    <rect x="0" y="40" width="150" height="250" rx="22" fill="#ffffff"/>
    <rect x="14" y="66" width="122" height="180" rx="8" fill="#dbe7ff"/>
    <path d="M40 120 h50 l20 20 v70 h-70 z" fill="#0b2c5f"/>
    <rect x="52" y="150" width="46" height="40" rx="4" fill="#ffd76a"/>
    <rect x="160" y="0" width="150" height="250" rx="22" fill="#ffffff" opacity=".92"/>
    <rect x="174" y="26" width="122" height="180" rx="8" fill="#dbe7ff"/>
    <path d="M200 80 h50 l20 20 v70 h-70 z" fill="#1558d6"/>
    <rect x="212" y="110" width="46" height="40" rx="4" fill="#ffffff"/>
    <rect x="200" y="-60" width="16" height="30" rx="3" fill="#ffd76a"/>
    <rect x="224" y="-80" width="16" height="50" rx="3" fill="#ffd76a"/>
    <rect x="248" y="-100" width="16" height="70" rx="3" fill="#ffd76a"/>
  </g>

  <rect x="70" y="80" width="350" height="56" rx="28" fill="#ffd76a"/>
  <text x="245" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">副回線サービス終了後</text>

  <text x="70" y="248" font-size="78" font-weight="800" fill="#ffffff">サブ回線の格安SIM</text>
  <text x="70" y="346" font-size="78" font-weight="800" fill="#ffd76a">年いくらで持てる?</text>
  <text x="70" y="426" font-size="34" font-weight="700" fill="#dbe7ff">障害時に止まらない組み合わせ表</text>
  <text x="70" y="476" font-size="34" font-weight="700" fill="#dbe7ff">JAPANローミングで足りるかも判定</text>
  <text x="70" y="572" font-size="26" font-weight="700" fill="#9fc1f5">回線コンパス</text>
</svg>
