<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="光回線の工事は何をする?当日の流れと穴あけなしで済む条件" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:電柱から家の外壁へ光ケーブル、室内に光コンセント -->
  <g transform="translate(900, 330) scale(0.9)">
    <rect x="230" y="0" width="14" height="270" rx="4" fill="#c3d7f7"/>
    <rect x="206" y="24" width="62" height="10" rx="4" fill="#c3d7f7"/>
    <path d="M237 34 Q150 70 70 96" fill="none" stroke="#ffd76a" stroke-width="6" stroke-linecap="round"/>
    <polygon points="-10,110 90,40 190,110" fill="#9fc1f5"/>
    <rect x="10" y="108" width="160" height="150" fill="#ffffff"/>
    <circle cx="66" cy="98" r="9" fill="#ffd76a"/>
    <path d="M66 107 L66 150 L118 150" fill="none" stroke="#ffd76a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="116" y="136" width="36" height="30" rx="6" fill="#1558d6"/>
    <circle cx="134" cy="151" r="6" fill="#ffffff"/>
    <rect x="34" y="190" width="52" height="68" rx="4" fill="#eaf1fd"/>
    <circle cx="-2" cy="236" r="32" fill="#3fbf7f"/>
    <path d="M-15 236 L-5 246 L12 224" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="70" y="80" width="324" height="56" rx="28" fill="#ffd76a"/>
  <text x="232" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">当日の流れを図解</text>

  <text x="70" y="248" font-size="80" font-weight="800" fill="#ffffff">光回線の工事は</text>
  <text x="70" y="360" font-size="80" font-weight="800" fill="#ffd76a">何をする?穴あけは?</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">作業の中身・所要時間・穴あけなしで済む条件</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
