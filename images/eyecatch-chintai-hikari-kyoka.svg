<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="賃貸で光回線を勝手に引ける?許可が要るかは工事の種類で決まる" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:集合住宅と鍵(許可)のイラスト -->
  <g transform="translate(895, 330) scale(0.9)">
    <rect x="30" y="40" width="170" height="230" rx="12" fill="#ffffff"/>
    <rect x="30" y="40" width="170" height="38" rx="12" fill="#9fc1f5"/>
    <g fill="#9fc1f5">
      <rect x="52" y="96" width="40" height="34" rx="5"/>
      <rect x="112" y="96" width="40" height="34" rx="5"/>
      <rect x="52" y="148" width="40" height="34" rx="5"/>
      <rect x="112" y="148" width="40" height="34" rx="5"/>
      <rect x="52" y="200" width="40" height="34" rx="5"/>
    </g>
    <rect x="112" y="200" width="40" height="34" rx="5" fill="#ffd76a"/>
    <path d="M200 216 H252" stroke="#ffd76a" stroke-width="12" stroke-linecap="round"/>
    <circle cx="268" cy="216" r="30" fill="none" stroke="#ffd76a" stroke-width="12"/>
    <circle cx="268" cy="216" r="8" fill="#0b2c5f"/>
  </g>

  <rect x="70" y="80" width="316" height="56" rx="28" fill="#ffd76a"/>
  <text x="228" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">工事4レベルで判定</text>

  <text x="70" y="248" font-size="82" font-weight="800" fill="#ffffff">賃貸で光回線を</text>
  <text x="70" y="360" font-size="82" font-weight="800" fill="#ffd76a">勝手に引ける?</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">許可が要るかは工事の種類で決まる</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
