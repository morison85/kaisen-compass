<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="中継機とメッシュWi-Fiのバックホール(親機までの足回り)の違いを比べた図" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <rect width="1200" height="640" fill="#f4f7fc"/>

  <text x="60" y="52" font-size="28" font-weight="800" fill="#0b2c5f">① 中継機・同じ周波数帯だけで中継する(いちばん安いが速度の天井が半分)</text>
  <rect x="60" y="76" width="200" height="96" rx="16" fill="#ffffff" stroke="#c8d6ee" stroke-width="2"/>
  <text x="160" y="116" text-anchor="middle" font-size="21" font-weight="800" fill="#0b2c5f">親機</text>
  <text x="160" y="148" text-anchor="middle" font-size="18" fill="#42557a">ルーター</text>
  <path d="M272 124 h120" stroke="#c2410c" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 12"/>
  <text x="332" y="106" text-anchor="middle" font-size="17" font-weight="700" fill="#c2410c">5GHz</text>
  <rect x="404" y="76" width="200" height="96" rx="16" fill="#ffffff" stroke="#c8d6ee" stroke-width="2"/>
  <text x="504" y="116" text-anchor="middle" font-size="21" font-weight="800" fill="#0b2c5f">中継機</text>
  <text x="504" y="148" text-anchor="middle" font-size="18" fill="#42557a">受信と送信を交互に</text>
  <path d="M616 124 h120" stroke="#c2410c" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 12"/>
  <text x="676" y="106" text-anchor="middle" font-size="17" font-weight="700" fill="#c2410c">5GHz</text>
  <rect x="748" y="76" width="200" height="96" rx="16" fill="#ffffff" stroke="#c8d6ee" stroke-width="2"/>
  <text x="848" y="116" text-anchor="middle" font-size="21" font-weight="800" fill="#0b2c5f">スマホ・PC</text>
  <text x="848" y="148" text-anchor="middle" font-size="18" fill="#42557a">奥の部屋</text>
  <rect x="972" y="86" width="168" height="76" rx="14" fill="#fff1e6" stroke="#f0b48a" stroke-width="2"/>
  <text x="1056" y="118" text-anchor="middle" font-size="19" font-weight="800" fill="#c2410c">速度の天井</text>
  <text x="1056" y="146" text-anchor="middle" font-size="22" font-weight="800" fill="#c2410c">約50%</text>

  <line x1="60" y1="204" x2="1140" y2="204" stroke="#d7e1f2" stroke-width="2"/>

  <text x="60" y="252" font-size="28" font-weight="800" fill="#0b2c5f">② 中継機・デュアルバンド同時接続(足回りと配り先で帯を分ける)</text>
  <rect x="60" y="276" width="200" height="96" rx="16" fill="#ffffff" stroke="#c8d6ee" stroke-width="2"/>
  <text x="160" y="316" text-anchor="middle" font-size="21" font-weight="800" fill="#0b2c5f">親機</text>
  <text x="160" y="348" text-anchor="middle" font-size="18" fill="#42557a">ルーター</text>
  <path d="M272 324 h120" stroke="#1558d6" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 12"/>
  <text x="332" y="306" text-anchor="middle" font-size="17" font-weight="700" fill="#1558d6">5GHz</text>
  <rect x="404" y="276" width="200" height="96" rx="16" fill="#ffffff" stroke="#c8d6ee" stroke-width="2"/>
  <text x="504" y="316" text-anchor="middle" font-size="21" font-weight="800" fill="#0b2c5f">中継機</text>
  <text x="504" y="348" text-anchor="middle" font-size="17" fill="#42557a">2つの帯を同時に使う</text>
  <path d="M616 324 h120" stroke="#0f766e" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 12"/>
  <text x="676" y="306" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">2.4GHz</text>
  <rect x="748" y="276" width="200" height="96" rx="16" fill="#ffffff" stroke="#c8d6ee" stroke-width="2"/>
  <text x="848" y="316" text-anchor="middle" font-size="21" font-weight="800" fill="#0b2c5f">スマホ・PC</text>
  <text x="848" y="348" text-anchor="middle" font-size="18" fill="#42557a">奥の部屋</text>
  <rect x="972" y="286" width="168" height="76" rx="14" fill="#eef7f5" stroke="#8ec7bd" stroke-width="2"/>
  <text x="1056" y="318" text-anchor="middle" font-size="19" font-weight="800" fill="#0f766e">速度の天井</text>
  <text x="1056" y="346" text-anchor="middle" font-size="22" font-weight="800" fill="#0f766e">約60〜70%</text>

  <line x1="60" y1="404" x2="1140" y2="404" stroke="#d7e1f2" stroke-width="2"/>

  <text x="60" y="452" font-size="28" font-weight="800" fill="#0b2c5f">③ メッシュ・有線バックホール(足回りをLANケーブルに逃がす)</text>
  <rect x="60" y="476" width="200" height="96" rx="16" fill="#0b2c5f"/>
  <text x="160" y="516" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">親機</text>
  <text x="160" y="548" text-anchor="middle" font-size="18" fill="#cfe0ff">コントローラ</text>
  <path d="M272 524 h120" stroke="#0b2c5f" stroke-width="9" stroke-linecap="round"/>
  <text x="332" y="506" text-anchor="middle" font-size="17" font-weight="700" fill="#0b2c5f">LANケーブル</text>
  <rect x="404" y="476" width="200" height="96" rx="16" fill="#0b2c5f"/>
  <text x="504" y="516" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">サテライト</text>
  <text x="504" y="548" text-anchor="middle" font-size="17" fill="#cfe0ff">電波の分配だけに専念</text>
  <path d="M616 524 h120" stroke="#1558d6" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 12"/>
  <text x="676" y="506" text-anchor="middle" font-size="17" font-weight="700" fill="#1558d6">5GHz</text>
  <rect x="748" y="476" width="200" height="96" rx="16" fill="#ffffff" stroke="#c8d6ee" stroke-width="2"/>
  <text x="848" y="516" text-anchor="middle" font-size="21" font-weight="800" fill="#0b2c5f">スマホ・PC</text>
  <text x="848" y="548" text-anchor="middle" font-size="18" fill="#42557a">奥の部屋</text>
  <rect x="972" y="486" width="168" height="76" rx="14" fill="#fff8e1" stroke="#e8c76a" stroke-width="2"/>
  <text x="1056" y="518" text-anchor="middle" font-size="19" font-weight="800" fill="#8a6100">速度の天井</text>
  <text x="1056" y="546" text-anchor="middle" font-size="20" font-weight="800" fill="#8a6100">親機とほぼ同等</text>

  <text x="60" y="608" font-size="19" fill="#42557a">※ 数値は仕組み上の目安。実際の速度は距離・壁材・電波の混雑・契約回線の速度に左右されます。</text>
</svg>
