<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ソフトバンクエアーが遅いときの対策ガイド" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:ホームルーターと速度計のイラスト -->
  <g transform="translate(882, 325) scale(0.9)">
    <rect x="60" y="70" width="96" height="180" rx="20" fill="#ffffff"/>
    <rect x="80" y="96" width="56" height="40" rx="7" fill="#0b2c5f"/>
    <circle cx="108" cy="230" r="9" fill="#ffd76a"/>
    <path d="M88 176 q20 -22 40 0" fill="none" stroke="#1558d6" stroke-width="8" stroke-linecap="round"/>
    <path d="M74 158 q34 -38 68 0" fill="none" stroke="#9fc1f5" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(168,124) scale(0.86)">
      <path d="M0 84 a84 84 0 0 1 168 0 z" fill="#ffffff"/>
      <path d="M84 84 L34 44" stroke="#e8443a" stroke-width="12" stroke-linecap="round"/>
      <circle cx="84" cy="84" r="12" fill="#0b2c5f"/>
      <circle cx="26" cy="66" r="6" fill="#e8443a"/>
      <circle cx="84" cy="26" r="6" fill="#ffd76a"/>
      <circle cx="142" cy="66" r="6" fill="#2c9f5a"/>
    </g>
  </g>

  <rect x="70" y="80" width="336" height="56" rx="28" fill="#ffd76a"/>
  <text x="238" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">5分でできる対策から</text>

  <text x="70" y="248" font-size="72" font-weight="800" fill="#ffffff">ソフトバンクエアー</text>
  <text x="70" y="356" font-size="72" font-weight="800" fill="#ffd76a">が遅いときの対策</text>
  <text x="70" y="432" font-size="31" font-weight="600" fill="#cfe0ff">置き場所・機種変更・乗り換えの判断基準</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
