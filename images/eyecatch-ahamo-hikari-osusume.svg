<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ahamoユーザーの光回線おすすめ。セット割なしで損しない選び方" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右側: 2択カード -->
  <g transform="translate(860,140)">
    <rect x="0" y="0" width="280" height="330" rx="22" fill="#ffffff"/>
    <text x="140" y="46" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2c5f">マンション・月額</text>
    <text x="30" y="104" font-size="18" font-weight="700" fill="#5f6b7a">ahamo光(2年契約)</text>
    <text x="250" y="146" text-anchor="end" font-size="34" font-weight="800" fill="#0b2c5f">3,630円</text>
    <line x1="30" y1="172" x2="250" y2="172" stroke="#dde5ef" stroke-width="2"/>
    <text x="30" y="212" font-size="18" font-weight="700" fill="#5f6b7a">縛りなし光(GMO)</text>
    <text x="250" y="254" text-anchor="end" font-size="34" font-weight="800" fill="#0e9f6e">3,773円</text>
    <text x="140" y="300" text-anchor="middle" font-size="17" font-weight="700" fill="#5f6b7a">差は月143円。決め手は縛りと機器</text>
  </g>

  <!-- バッジ: 「セット割なしの正解」9文字×29=261+60=321 -->
  <rect x="70" y="80" width="321" height="56" rx="28" fill="#ffd76a"/>
  <text x="230" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">セット割なしの正解</text>

  <!-- 見出し: 「ahamoユーザーの」(半角5=2.5+全角5)×74=555 / 「光回線おすすめ」7×74=518 → 右端625 (図版860) -->
  <text x="70" y="248" font-size="74" font-weight="800" fill="#ffffff">ahamoユーザーの</text>
  <text x="70" y="360" font-size="74" font-weight="800" fill="#ffffff"><tspan fill="#ffd76a">光回線</tspan>おすすめ</text>
  <!-- サブ: 「2年総額で比べる、ahamo光と縛りなし光」約19.5文字×31=605 -->
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">2年総額で比べる、ahamo光と縛りなし光</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
