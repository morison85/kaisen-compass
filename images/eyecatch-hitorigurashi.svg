<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="一人暮らしのWiFiの選び方" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1120" cy="60" r="220" fill="#ffffff" opacity=".06"/>
  <circle cx="1010" cy="560" r="160" fill="#ffffff" opacity=".05"/>

  <!-- 右:部屋のイラスト -->
  <g transform="translate(830,150)">
    <rect x="0" y="40" width="300" height="230" rx="14" fill="#ffffff"/>
    <!-- 窓 -->
    <rect x="30" y="70" width="90" height="80" rx="8" fill="#9fc1f5"/>
    <!-- ソファ -->
    <rect x="150" y="170" width="120" height="52" rx="12" fill="#1558d6"/>
    <rect x="150" y="140" width="120" height="36" rx="12" fill="#4b8bf5"/>
    <!-- テーブル+ルーター -->
    <rect x="34" y="196" width="86" height="12" rx="6" fill="#c9d6e8"/>
    <rect x="52" y="160" width="50" height="36" rx="6" fill="#0b2c5f"/>
    <g fill="none" stroke="#ffd76a" stroke-width="10" stroke-linecap="round">
      <path d="M64 138 a26 26 0 0 1 26 0"/>
      <path d="M56 118 a44 44 0 0 1 42 0"/>
    </g>
  </g>

  <rect x="70" y="96" width="300" height="58" rx="29" fill="#ffd76a"/>
  <text x="220" y="136" text-anchor="middle" font-size="30" font-weight="800" fill="#0b2c5f">3タイプ徹底比較</text>

  <text x="70" y="256" font-size="92" font-weight="800" fill="#ffffff">一人暮らしのWiFi</text>
  <text x="70" y="376" font-size="92" font-weight="800" fill="#ffffff">の<tspan fill="#ffd76a">正解</tspan></text>
  <text x="70" y="452" font-size="38" font-weight="600" fill="#cfe0ff">光回線?ホームルーター?ポケット型?迷いに終止符</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
