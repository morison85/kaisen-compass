<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="auひかりの申し込み窓口・代理店比較" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:窓口3つと当たりの旗 -->
  <g transform="translate(880, 330) scale(0.9)">
    <rect x="0" y="90" width="86" height="120" rx="10" fill="#ffffff" opacity=".55"/>
    <rect x="104" y="60" width="96" height="150" rx="10" fill="#ffffff"/>
    <rect x="104" y="60" width="96" height="34" rx="10" fill="#ffd76a"/>
    <text x="152" y="160" text-anchor="middle" font-size="44" font-weight="800" fill="#0b2c5f">¥</text>
    <rect x="218" y="90" width="86" height="120" rx="10" fill="#ffffff" opacity=".55"/>
    <path d="M152 10 V52" stroke="#ffd76a" stroke-width="10" stroke-linecap="round"/>
    <path d="M152 12 L206 30 L152 48 Z" fill="#f26f1d"/>
  </g>

  <rect x="70" y="80" width="322" height="56" rx="28" fill="#ffd76a"/>
  <text x="231" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">受け取り確実性で選ぶ</text>

  <text x="70" y="248" font-size="82" font-weight="800" fill="#ffffff">auひかり</text>
  <text x="70" y="360" font-size="78" font-weight="800" fill="#ffd76a">申込窓口の比較</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">同じ回線でも窓口で数万円変わる理由</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
