<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ホームルーターの引越し手続きと住所変更ルール" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:ホームルーターを新居へ運ぶイラスト -->
  <g transform="translate(880, 320) scale(0.9)">
    <path d="M10 40 H196" fill="none" stroke="#ffd76a" stroke-width="14" stroke-linecap="round"/>
    <path d="M172 14 L206 40 L172 66" fill="none" stroke="#ffd76a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 180 L140 96 L250 180 V300 H30 Z" fill="#ffffff"/>
    <rect x="112" y="234" width="56" height="66" rx="6" fill="#1558d6"/>
    <rect x="96" y="192" width="88" height="30" rx="9" fill="#ffd76a"/>
    <circle cx="118" cy="207" r="5.5" fill="#0b2c5f"/>
    <circle cx="140" cy="207" r="5.5" fill="#0b2c5f"/>
    <circle cx="162" cy="207" r="5.5" fill="#0b2c5f"/>
  </g>

  <rect x="70" y="80" width="350" height="56" rx="28" fill="#ffd76a"/>
  <text x="245" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">住所変更ルール早見表</text>

  <text x="70" y="248" font-size="78" font-weight="800" fill="#ffffff">ホームルーターの</text>
  <text x="70" y="360" font-size="78" font-weight="800" fill="#ffd76a">引越し手続き</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">住所変更を忘れると止まる3社のルール差</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
