<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="通話が多い人の格安SIM。かけ放題の分かれ目を計算" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:スマホと通話時間の吹き出し -->
  <g transform="translate(900, 335) scale(0.9)">
    <rect x="20" y="0" width="150" height="250" rx="22" fill="#ffffff"/>
    <rect x="34" y="26" width="122" height="180" rx="8" fill="#dbe7ff"/>
    <circle cx="95" cy="228" r="10" fill="#9fc1f5"/>
    <path d="M70 86 q-6 30 22 58 q28 28 58 22 l6 -18 l-22 -12 l-10 10 q-20 -8 -34 -34 l10 -10 l-12 -22 z" fill="#0b2c5f" transform="translate(-14,-10)"/>
    <rect x="160" y="-10" width="120" height="70" rx="16" fill="#ffd76a"/>
    <polygon points="172,58 196,58 176,80" fill="#ffd76a"/>
    <text x="220" y="38" text-anchor="middle" font-size="34" font-weight="800" fill="#0b2c5f">5分</text>
  </g>

  <rect x="70" y="80" width="360" height="56" rx="28" fill="#ffd76a"/>
  <text x="250" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">月何分から得になる?</text>

  <text x="70" y="248" font-size="78" font-weight="800" fill="#ffffff">通話が多い人の格安SIM</text>
  <text x="70" y="346" font-size="78" font-weight="800" fill="#ffd76a">かけ放題の分かれ目</text>
  <text x="70" y="426" font-size="34" font-weight="700" fill="#dbe7ff">5分・10分・無制限を7社で計算</text>
  <text x="70" y="476" font-size="34" font-weight="700" fill="#dbe7ff">対象外の番号と切り替えの目安も</text>
  <text x="70" y="572" font-size="26" font-weight="700" fill="#9fc1f5">回線コンパス</text>
</svg>
