<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="GMOとくとくBB光のキャンペーン完全ガイド" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:カレンダーとお金 -->
  <g transform="translate(895, 320) scale(0.9)">
    <rect x="10" y="30" width="220" height="190" rx="16" fill="#ffffff"/>
    <rect x="10" y="30" width="220" height="46" rx="16" fill="#9fc1f5"/>
    <rect x="46" y="14" width="14" height="34" rx="6" fill="#ffd76a"/>
    <rect x="170" y="14" width="14" height="34" rx="6" fill="#ffd76a"/>
    <circle cx="120" cy="150" r="46" fill="#ffd76a"/>
    <text x="120" y="168" text-anchor="middle" font-size="50" font-weight="800" fill="#0b2c5f">¥</text>
  </g>

  <rect x="70" y="80" width="384" height="56" rx="28" fill="#ffd76a"/>
  <text x="262" y="119" text-anchor="middle" font-size="27" font-weight="800" fill="#0b2c5f">10ヶ月後も取りこぼさない</text>

  <text x="70" y="248" font-size="70" font-weight="800" fill="#ffffff">GMOとくとくBB光</text>
  <text x="70" y="360" font-size="62" font-weight="800" fill="#ffd76a">キャンペーン完全ガイド</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">受け取り手順と縛りなしの実際</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
