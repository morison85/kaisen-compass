<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ひかり電話は必要か不要か。月550円の損益分岐" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:固定電話と天秤のような比較 -->
  <g transform="translate(900, 320) scale(0.9)">
    <rect x="10" y="90" width="230" height="170" rx="18" fill="#ffffff"/>
    <rect x="38" y="122" width="120" height="70" rx="10" fill="#d7e3f5"/>
    <circle cx="68" cy="146" r="8" fill="#9fc1f5"/><circle cx="98" cy="146" r="8" fill="#9fc1f5"/><circle cx="128" cy="146" r="8" fill="#9fc1f5"/>
    <circle cx="68" cy="172" r="8" fill="#9fc1f5"/><circle cx="98" cy="172" r="8" fill="#9fc1f5"/><circle cx="128" cy="172" r="8" fill="#9fc1f5"/>
    <path d="M178 112 C 210 112, 210 148, 186 156" fill="none" stroke="#0b2c5f" stroke-width="14" stroke-linecap="round"/>
    <rect x="160" y="98" width="34" height="26" rx="8" fill="#0b2c5f"/>
    <rect x="170" y="146" width="34" height="26" rx="8" fill="#0b2c5f"/>
    <circle cx="98" cy="228" r="26" fill="#ffd76a"/>
    <text x="98" y="242" text-anchor="middle" font-size="30" font-weight="800" fill="#0b2c5f">¥</text>
    <text x="172" y="238" text-anchor="middle" font-size="24" font-weight="800" fill="#0b2c5f">月550円</text>
  </g>

  <rect x="70" y="80" width="191" height="56" rx="28" fill="#ffd76a"/>
  <text x="165" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">2軸で判定</text>

  <text x="70" y="248" font-size="74" font-weight="800" fill="#ffffff">ひかり電話は<tspan fill="#ffd76a">必要?</tspan></text>
  <text x="70" y="360" font-size="74" font-weight="800" fill="#ffffff">月550円の分岐点</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">番号を残す人・手放す人の判断基準</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
