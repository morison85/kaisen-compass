<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="楽天モバイル×楽天ひかりのセットは本当にお得か検証" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:セット(重なる2つの輪)のイラスト -->
  <g transform="translate(890, 320) scale(0.9)">
    <circle cx="110" cy="180" r="95" fill="#ffffff" opacity=".92"/>
    <circle cx="210" cy="180" r="95" fill="#ffd76a" opacity=".92"/>
    <text x="95" y="196" text-anchor="middle" font-size="42" font-weight="800" fill="#1558d6">P</text>
    <text x="225" y="196" text-anchor="middle" font-size="42" font-weight="800" fill="#0b2c5f">回</text>
  </g>

  <rect x="70" y="80" width="480" height="56" rx="28" fill="#ffd76a"/>
  <text x="310" y="118" text-anchor="middle" font-size="24" font-weight="800" fill="#0b2c5f">毎月1,000ポイント還元の実質価値</text>

  <text x="70" y="248" font-size="82" font-weight="800" fill="#ffffff">楽天モバイル×</text>
  <text x="70" y="360" font-size="82" font-weight="800" fill="#ffd76a">楽天ひかり</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">セットは本当にお得か検証</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
