<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="光回線のキャッシュバックをもらってすぐ解約できる?返還条件と2回目の再契約ルール" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:カレンダーと現金、解約の赤い印 -->
  <g transform="translate(905, 335) scale(0.9)">
    <rect x="0" y="20" width="200" height="190" rx="16" fill="#ffffff"/>
    <rect x="0" y="20" width="200" height="46" rx="16" fill="#9fc1f5"/>
    <rect x="0" y="48" width="200" height="18" fill="#9fc1f5"/>
    <rect x="38" y="6" width="12" height="32" rx="6" fill="#c3d7f7"/>
    <rect x="150" y="6" width="12" height="32" rx="6" fill="#c3d7f7"/>
    <g fill="#eaf1fd">
      <rect x="20" y="84" width="34" height="28" rx="5"/><rect x="64" y="84" width="34" height="28" rx="5"/><rect x="108" y="84" width="34" height="28" rx="5"/><rect x="152" y="84" width="34" height="28" rx="5"/>
      <rect x="20" y="122" width="34" height="28" rx="5"/><rect x="64" y="122" width="34" height="28" rx="5"/><rect x="152" y="122" width="34" height="28" rx="5"/>
      <rect x="20" y="160" width="34" height="28" rx="5"/><rect x="64" y="160" width="34" height="28" rx="5"/><rect x="108" y="160" width="34" height="28" rx="5"/><rect x="152" y="160" width="34" height="28" rx="5"/>
    </g>
    <rect x="108" y="122" width="34" height="28" rx="5" fill="#ffd76a"/>
    <circle cx="125" cy="136" r="22" fill="none" stroke="#e4572e" stroke-width="5"/>
    <circle cx="232" cy="200" r="54" fill="#ffd76a"/>
    <circle cx="232" cy="200" r="42" fill="none" stroke="#e0b445" stroke-width="5"/>
    <text x="232" y="219" text-anchor="middle" font-size="54" font-weight="800" fill="#0b2c5f">¥</text>
  </g>

  <rect x="70" y="80" width="353" height="56" rx="28" fill="#ffd76a"/>
  <text x="246" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">受取後の解約を検証</text>

  <text x="70" y="248" font-size="80" font-weight="800" fill="#ffffff">キャッシュバック</text>
  <text x="70" y="358" font-size="76" font-weight="800" fill="#ffd76a">もらって即解約は損?</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">入金・返還条項・工事費残債の3つの期限で判定</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
