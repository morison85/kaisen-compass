<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Web会議が途切れる原因と対処法" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1120" cy="60" r="220" fill="#ffffff" opacity=".06"/>
  <circle cx="1010" cy="560" r="160" fill="#ffffff" opacity=".05"/>

  <!-- 右:ノートPCとビデオ会議 -->
  <g transform="translate(820,170)">
    <rect x="20" y="20" width="280" height="180" rx="14" fill="#ffffff"/>
    <rect x="40" y="40" width="115" height="80" rx="8" fill="#9fc1f5"/>
    <circle cx="97" cy="70" r="16" fill="#ffffff"/>
    <path d="M70 120 c6-18 48-18 54 0z" fill="#ffffff"/>
    <rect x="168" y="40" width="115" height="80" rx="8" fill="#c9d6e8"/>
    <!-- ローディング表示 -->
    <circle cx="225" cy="80" r="22" fill="none" stroke="#1558d6" stroke-width="8" stroke-dasharray="88 50" stroke-linecap="round"/>
    <rect x="40" y="136" width="243" height="14" rx="7" fill="#eaf1fd"/>
    <path d="M0 200 h320 l-24 34 H24 Z" fill="#c9d6e8"/>
    <!-- ビックリマーク -->
    <circle cx="300" cy="10" r="34" fill="#ffd76a"/>
    <text x="300" y="26" text-anchor="middle" font-size="44" font-weight="800" fill="#0b2c5f">!</text>
  </g>

  <rect x="70" y="96" width="330" height="58" rx="29" fill="#ffd76a"/>
  <text x="235" y="136" text-anchor="middle" font-size="30" font-weight="800" fill="#0b2c5f">今すぐできる対処法</text>

  <text x="70" y="256" font-size="90" font-weight="800" fill="#ffffff">Web会議が</text>
  <text x="70" y="376" font-size="90" font-weight="800" fill="#ffffff">「<tspan fill="#ffd76a">途切れる</tspan>」原因</text>
  <text x="70" y="452" font-size="38" font-weight="600" fill="#cfe0ff">5分で切り分け。応急処置から根本解決まで</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
