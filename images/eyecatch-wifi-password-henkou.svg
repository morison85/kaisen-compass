<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Wi-Fiパスワードの変え方と、全端末のつなぎ直し" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:ルーターと電波、鍵 -->
  <g transform="translate(900, 330) scale(0.9)">
    <path d="M70 70 A70 70 0 0 1 190 70" fill="none" stroke="#c3d7f7" stroke-width="10" stroke-linecap="round"/>
    <path d="M95 95 A40 40 0 0 1 165 95" fill="none" stroke="#c3d7f7" stroke-width="10" stroke-linecap="round"/>
    <circle cx="130" cy="118" r="8" fill="#c3d7f7"/>
    <rect x="20" y="140" width="220" height="80" rx="16" fill="#ffffff"/>
    <circle cx="60" cy="180" r="9" fill="#2bb673"/>
    <circle cx="96" cy="180" r="9" fill="#2bb673"/>
    <rect x="130" y="171" width="60" height="18" rx="9" fill="#c3d7f7"/>
    <circle cx="250" cy="70" r="26" fill="none" stroke="#ffd76a" stroke-width="11"/>
    <path d="M250 96 V160 M250 128 H272 M250 148 H268" stroke="#ffd76a" stroke-width="11" stroke-linecap="round"/>
  </g>

  <rect x="70" y="80" width="320" height="56" rx="28" fill="#ffd76a"/>
  <text x="230" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">メーカー別の手順つき</text>

  <text x="70" y="248" font-size="80" font-weight="800" fill="#ffffff">Wi-Fiパスワードの</text>
  <text x="70" y="360" font-size="80" font-weight="800" fill="#ffd76a">変え方とつなぎ直し</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">2つの変え方・端末別の再接続・つながらない時</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
