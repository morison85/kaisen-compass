<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="賃貸で光回線の工事ができないときの対処法" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:集合住宅と、工事NGを示すバツ、そして代替のホームルーター -->
  <g transform="translate(900, 292)">
    <rect x="0" y="20" width="150" height="210" rx="10" fill="#ffffff"/>
    <rect x="24" y="48" width="38" height="38" rx="5" fill="#9fc1f5"/>
    <rect x="88" y="48" width="38" height="38" rx="5" fill="#dbe7fb"/>
    <rect x="24" y="106" width="38" height="38" rx="5" fill="#dbe7fb"/>
    <rect x="88" y="106" width="38" height="38" rx="5" fill="#9fc1f5"/>
    <rect x="24" y="164" width="38" height="38" rx="5" fill="#9fc1f5"/>
    <rect x="88" y="164" width="38" height="38" rx="5" fill="#dbe7fb"/>
    <g stroke="#ff6b6b" stroke-width="13" stroke-linecap="round">
      <line x1="176" y1="66" x2="222" y2="112"/>
      <line x1="222" y1="66" x2="176" y2="112"/>
    </g>
    <rect x="172" y="150" width="60" height="96" rx="12" fill="#ffd76a"/>
    <rect x="186" y="168" width="32" height="22" rx="4" fill="#0b2c5f"/>
    <circle cx="202" cy="216" r="7" fill="#0b2c5f"/>
  </g>

  <rect x="70" y="80" width="356" height="56" rx="28" fill="#ffd76a"/>
  <text x="248" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">諦める前に3つの確認</text>

  <text x="70" y="248" font-size="72" font-weight="800" fill="#ffffff">賃貸で光回線の</text>
  <text x="70" y="352" font-size="72" font-weight="800" fill="#ffd76a">工事ができない</text>
  <text x="70" y="432" font-size="31" font-weight="600" fill="#cfe0ff">その「無理」、覆せることがあります</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
