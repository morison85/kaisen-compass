<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="個人事業主の光回線を法人契約・固定IP・経費の3点から選ぶ方法" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:ノートPCと請求書 -->
  <g transform="translate(890, 330) scale(0.9)">
    <rect x="150" y="0" width="120" height="150" rx="10" fill="#ffffff"/>
    <rect x="170" y="24" width="80" height="10" rx="5" fill="#9fc1f5"/>
    <rect x="170" y="48" width="60" height="10" rx="5" fill="#9fc1f5"/>
    <rect x="170" y="72" width="70" height="10" rx="5" fill="#9fc1f5"/>
    <circle cx="232" cy="118" r="18" fill="#ffd76a"/>
    <text x="232" y="126" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2c5f">¥</text>
    <rect x="10" y="90" width="210" height="140" rx="12" fill="#ffffff"/>
    <rect x="26" y="106" width="178" height="108" rx="6" fill="#1558d6"/>
    <g fill="none" stroke="#ffd76a" stroke-width="9" stroke-linecap="round">
      <path d="M80 170 a50 50 0 0 1 70 0"/>
      <path d="M62 150 a76 76 0 0 1 106 0" opacity=".7"/>
