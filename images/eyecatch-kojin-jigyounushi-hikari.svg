  </g>

  <rect x="70" y="80" width="380" height="56" rx="28" fill="#ffd76a"/>
  <text x="260" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">法人契約・固定IP・経費</text>

