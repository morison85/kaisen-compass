<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ホームルーターはやめたほうがいい?向く人・向かない人の判定ガイド" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:ホームルーター本体+判定バッジ -->
  <g transform="translate(880, 330) scale(0.9)">
    <rect x="10" y="70" width="200" height="150" rx="20" fill="#ffffff"/>
    <rect x="10" y="70" width="200" height="150" rx="20" fill="none" stroke="#c3d7f7" stroke-width="4"/>
    <circle cx="110" cy="145" r="46" fill="#eaf1fd"/>
    <path d="M92 145 a18 18 0 1 1 36 0 a18 18 0 1 1 -36 0" fill="none" stroke="#1558d6" stroke-width="8"/>
    <circle cx="110" cy="145" r="6" fill="#1558d6"/>
    <rect x="90" y="196" width="40" height="10" rx="5" fill="#9fc1f5"/>
    <path d="M60 70 L40 10" stroke="#c3d7f7" stroke-width="8" stroke-linecap="round"/>
    <path d="M160 70 L180 10" stroke="#c3d7f7" stroke-width="8" stroke-linecap="round"/>
    <circle cx="200" cy="40" r="34" fill="#ffd76a"/>
    <text x="200" y="52" text-anchor="middle" font-size="34" font-weight="800" fill="#0b2c5f">?</text>
    <circle cx="-6" cy="230" r="30" fill="#3fbf7f"/>
    <path d="M-18 230 L-8 240 L8 218" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="222" cy="236" r="30" fill="#e4572e"/>
    <path d="M212 226 L232 246 M232 226 L212 246" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <rect x="70" y="80" width="292" height="56" rx="28" fill="#ffd76a"/>
  <text x="216" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">判定チャートつき</text>

  <text x="70" y="248" font-size="82" font-weight="800" fill="#ffffff">ホームルーターは</text>
  <text x="70" y="360" font-size="82" font-weight="800" fill="#ffd76a">やめたほうがいい?</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">向く人・向かない人を4つの軸で判定</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
