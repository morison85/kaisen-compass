<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="はじめてのネット契約 申し込みから開通までの流れ" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:申込書とチェックのイラスト -->
  <g transform="translate(900, 330) scale(0.9)">
    <rect x="20" y="40" width="200" height="250" rx="16" fill="#ffffff"/>
    <rect x="50" y="80" width="140" height="16" rx="8" fill="#9fc1f5"/>
    <rect x="50" y="118" width="110" height="12" rx="6" fill="#cfe0ff"/>
    <rect x="50" y="150" width="130" height="12" rx="6" fill="#cfe0ff"/>
    <rect x="50" y="182" width="96" height="12" rx="6" fill="#cfe0ff"/>
    <circle cx="178" cy="238" r="52" fill="#ffd76a"/>
    <path d="M152 238 L170 258 L206 216" fill="none" stroke="#0b2c5f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="70" y="80" width="321" height="56" rx="28" fill="#ffd76a"/>
  <text x="230" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">初めてでも迷わない</text>

  <text x="70" y="248" font-size="74" font-weight="800" fill="#ffffff">はじめてのネット契約</text>
  <text x="70" y="356" font-size="74" font-weight="800" fill="#ffd76a">申込〜開通の流れ</text>
  <text x="70" y="432" font-size="31" font-weight="600" fill="#cfe0ff">決めておく5つのことと、初月請求の内訳</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
