<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="光回線の10ギガは必要かどうかの判断ガイド" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:スピードメーター -->
  <g transform="translate(890, 340) scale(0.9)">
    <path d="M20 200 A130 130 0 0 1 280 200" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" opacity=".45"/>
    <path d="M20 200 A130 130 0 0 1 216 86" fill="none" stroke="#ffd76a" stroke-width="26" stroke-linecap="round"/>
    <circle cx="150" cy="200" r="18" fill="#ffffff"/>
    <path d="M150 200 L226 108" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <text x="150" y="258" text-anchor="middle" font-size="40" font-weight="800" fill="#ffffff">10G</text>
  </g>

  <rect x="70" y="80" width="379" height="56" rx="28" fill="#ffd76a"/>
  <text x="259" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">判断フローチャート付き</text>

  <text x="70" y="248" font-size="80" font-weight="800" fill="#ffffff">光回線の10ギガ</text>
  <text x="70" y="360" font-size="78" font-weight="800" fill="#ffd76a">必要?不要?</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">1ギガとの違い・料金・向いている人</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
