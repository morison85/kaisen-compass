<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="回線コンパス ネット回線選びの羅針盤" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右:コンパス -->
  <g transform="translate(880, 200)">
    <circle cx="110" cy="110" r="110" fill="#ffffff"/>
    <circle cx="110" cy="110" r="96" fill="none" stroke="#9fc1f5" stroke-width="4"/>
    <polygon points="110,34 133,110 110,186 87,110" fill="#1558d6"/>
    <polygon points="110,186 133,110 110,110" fill="#0b2c5f"/>
    <circle cx="110" cy="110" r="12" fill="#0b2c5f"/>
    <circle cx="110" cy="110" r="5" fill="#ffd76a"/>
  </g>

  <rect x="70" y="110" width="330" height="56" rx="28" fill="#ffd76a"/>
  <text x="235" y="149" text-anchor="middle" font-size="27" font-weight="800" fill="#0b2c5f">ネット回線選びの羅針盤</text>

  <text x="70" y="278" font-size="82" font-weight="800" fill="#ffffff">回線コンパス</text>
  <text x="70" y="376" font-size="44" font-weight="800" fill="#ffd76a">「わからない」を、3分でなくす。</text>
  <text x="70" y="446" font-size="29" font-weight="600" fill="#cfe0ff">光回線・ホームルーター・格安SIMの比較メディア</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">kaisen-compass.com</text>
  </g>
