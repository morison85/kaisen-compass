<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="光回線おすすめ7社を徹底比較" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1120" cy="60" r="220" fill="#ffffff" opacity=".06"/>
  <circle cx="1010" cy="560" r="160" fill="#ffffff" opacity=".05"/>

  <!-- 右:家と光回線イラスト -->
  <g transform="translate(830,150)">
    <path d="M40 130 L150 40 L260 130 V300 H40 Z" fill="#ffffff"/>
    <path d="M10 140 L150 25 L290 140" fill="none" stroke="#ffd76a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="115" y="200" width="70" height="100" rx="6" fill="#1558d6"/>
    <rect x="65" y="160" width="46" height="46" rx="6" fill="#9fc1f5"/>
    <rect x="189" y="160" width="46" height="46" rx="6" fill="#9fc1f5"/>
    <!-- 光ファイバー -->
    <path d="M-160 320 C -40 320, 20 250, 150 250" fill="none" stroke="#ffd76a" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 24"/>
    <circle cx="150" cy="250" r="14" fill="#ffd76a"/>
  </g>

  <!-- チップ -->
  <rect x="70" y="96" width="270" height="58" rx="29" fill="#ffd76a"/>
  <text x="205" y="136" text-anchor="middle" font-size="30" font-weight="800" fill="#0b2c5f">2026年最新版</text>

  <!-- タイトル -->
  <text x="70" y="256" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="2">光回線おすすめ</text>
  <text x="70" y="376" font-size="96" font-weight="800" fill="#ffffff"><tspan fill="#ffd76a">7社</tspan>を徹底比較</text>
  <text x="70" y="452" font-size="38" font-weight="600" fill="#cfe0ff">料金・速度・セット割で選ぶ &#8220;後悔しない1社&#8221;</text>

  <!-- ブランド -->
  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
