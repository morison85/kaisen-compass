  <rect x="70" y="80" width="320" height="56" rx="28" fill="#ffd76a"/>
  <text x="230" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">まず5分で切り分け</text>

  <text x="70" y="248" font-size="80" font-weight="800" fill="#ffffff">光回線の障害は</text>
  <text x="70" y="360" font-size="80" font-weight="800" fill="#ffd76a">本当に多い?</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">ランプの読み方と障害情報の確認先</text>

  <g transform="translate(70,530)">
