<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="光回線の障害は本当に多いのか。ランプの読み方と障害情報の確認先" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:ONUのランプと警告マークのイラスト -->
  <g transform="translate(890, 330) scale(0.9)">
    <rect x="20" y="30" width="210" height="150" rx="16" fill="#ffffff"/>
    <rect x="20" y="30" width="210" height="34" rx="16" fill="#9fc1f5"/>
    <rect x="20" y="52" width="210" height="12" fill="#9fc1f5"/>
    <circle cx="58" cy="100" r="13" fill="#3fbf6f"/>
    <circle cx="102" cy="100" r="13" fill="#3fbf6f"/>
    <circle cx="146" cy="100" r="13" fill="#e04b4b"/>
    <circle cx="190" cy="100" r="13" fill="#c9d8f2"/>
    <g fill="#c9d8f2">
      <rect x="42" y="128" width="32" height="9" rx="4.5"/>
      <rect x="86" y="128" width="32" height="9" rx="4.5"/>
      <rect x="130" y="128" width="32" height="9" rx="4.5"/>
      <rect x="174" y="128" width="32" height="9" rx="4.5"/>
    </g>
    <rect x="56" y="152" width="138" height="10" rx="5" fill="#dbe7ff"/>
    <g transform="translate(118, 150)">
      <path d="M62 8 L118 106 H6 Z" fill="#ffd76a" stroke="#0b2c5f" stroke-width="8" stroke-linejoin="round"/>
      <rect x="55" y="42" width="14" height="34" rx="7" fill="#0b2c5f"/>
      <circle cx="62" cy="88" r="8" fill="#0b2c5f"/>
