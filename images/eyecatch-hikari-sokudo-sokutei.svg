<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="光回線の速度測定の正しい方法と結果の見方" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:スピードメーターと、時間帯ごとの測定バー -->
  <g transform="translate(890, 330) scale(0.9)">
    <path d="M10 170 A120 120 0 0 1 250 170" fill="none" stroke="#c3d7f7" stroke-width="22" stroke-linecap="round"/>
    <path d="M10 170 A120 120 0 0 1 178 57" fill="none" stroke="#ffd76a" stroke-width="22" stroke-linecap="round"/>
    <circle cx="130" cy="170" r="14" fill="#ffffff"/>
    <path d="M130 170 L196 92" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <rect x="58" y="196" width="144" height="40" rx="10" fill="#ffffff"/>
    <text x="130" y="225" text-anchor="middle" font-size="26" font-weight="800" fill="#0b2c5f">Mbps</text>
  </g>

  <rect x="70" y="80" width="292" height="56" rx="28" fill="#ffd76a"/>
  <text x="216" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">数字が違う理由も</text>

  <text x="70" y="248" font-size="80" font-weight="800" fill="#ffffff">光回線の速度測定</text>
  <text x="70" y="360" font-size="80" font-weight="800" fill="#ffd76a">正しい測り方と見方</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">測定サイトの違い・時間帯別の測り方・判定基準</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
