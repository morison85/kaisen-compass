<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="スマホのテザリングを固定回線の代わりにできる条件と限界" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:スマホからノートPCへテザリング -->
  <g transform="translate(880, 330) scale(0.9)">
    <rect x="0" y="70" width="92" height="170" rx="16" fill="#ffffff"/>
    <rect x="10" y="92" width="72" height="126" rx="6" fill="#9fc1f5"/>
    <circle cx="46" cy="229" r="6" fill="#cfe0ff"/>
    <path d="M110 122 A46 46 0 0 1 110 188" fill="none" stroke="#ffd76a" stroke-width="11" stroke-linecap="round"/>
    <path d="M134 100 A70 70 0 0 1 134 210" fill="none" stroke="#ffd76a" stroke-width="11" stroke-linecap="round" opacity=".65"/>
    <rect x="152" y="110" width="164" height="104" rx="9" fill="#ffffff"/>
    <rect x="163" y="121" width="142" height="82" rx="4" fill="#9fc1f5"/>
    <rect x="136" y="216" width="196" height="14" rx="7" fill="#ffffff"/>
  </g>

  <rect x="70" y="80" width="346" height="56" rx="28" fill="#ffd76a"/>
  <text x="243" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">キャリア別の上限つき</text>

  <text x="70" y="248" font-size="76" font-weight="800" fill="#ffffff">テザリングを</text>
  <text x="70" y="360" font-size="76" font-weight="800" fill="#ffd76a">固定回線の代わりに</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">できる人の条件と、数字に出ない5つの限界</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
