<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="UQモバイルとLINEMOはどっちを選ぶか" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:自宅のネット回線と割引 -->
  <g transform="translate(880, 320) scale(0.9)">
    <path d="M20 122 L150 22 L280 122" fill="none" stroke="#ffd76a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="55" y="122" width="190" height="150" rx="14" fill="#ffffff"/>
    <path d="M105 202 a60 60 0 0 1 90 0" fill="none" stroke="#1558d6" stroke-width="12" stroke-linecap="round"/>
    <path d="M125 224 a32 32 0 0 1 50 0" fill="none" stroke="#1558d6" stroke-width="12" stroke-linecap="round"/>
    <circle cx="150" cy="248" r="9" fill="#0b2c5f"/>
    <circle cx="252" cy="250" r="42" fill="#ffd76a"/>
    <text x="252" y="266" text-anchor="middle" font-size="36" font-weight="800" fill="#0b2c5f">-¥</text>
  </g>

  <rect x="70" y="80" width="350" height="56" rx="28" fill="#ffd76a"/>
  <text x="245" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">早見表と判定チャート</text>

  <text x="70" y="246" font-size="68" font-weight="800" fill="#ffffff">UQモバイル vs LINEMO</text>
  <text x="70" y="356" font-size="82" font-weight="800" fill="#ffd76a">どっちを選ぶ?</text>
  <text x="70" y="432" font-size="31" font-weight="600" fill="#cfe0ff">決め手は自宅のネット回線が対象かどうか</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
