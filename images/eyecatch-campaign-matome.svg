<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="光回線・WiMAX・格安SIMのキャンペーンまとめ。毎日更新" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:締切のカレンダー -->
  <g transform="translate(880, 320)">
    <rect x="0" y="0" width="240" height="236" rx="16" fill="#ffffff"/>
    <rect x="0" y="0" width="240" height="58" rx="16" fill="#9fc1f5"/>
    <rect x="0" y="40" width="240" height="18" fill="#9fc1f5"/>
    <text x="120" y="42" text-anchor="middle" font-size="30" font-weight="800" fill="#0b2c5f">締切順</text>
    <rect x="34" y="84" width="172" height="22" rx="6" fill="#cfe0ff"/>
    <rect x="34" y="122" width="172" height="22" rx="6" fill="#cfe0ff"/>
    <rect x="34" y="160" width="172" height="22" rx="6" fill="#ffd76a"/>
  </g>

  <rect x="70" y="80" width="214" height="56" rx="28" fill="#ffd76a"/>
  <text x="177" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">毎日更新</text>

  <text x="70" y="248" font-size="84" font-weight="800" fill="#ffffff">キャンペーン</text>
  <text x="70" y="346" font-size="84" font-weight="800" fill="#ffd76a">まとめ</text>
  <text x="70" y="426" font-size="34" font-weight="700" fill="#dbe7ff">光回線・WiMAX・格安SIM</text>
  <text x="70" y="476" font-size="34" font-weight="700" fill="#dbe7ff">各社の公式ページで確認</text>
  <text x="70" y="572" font-size="26" font-weight="700" fill="#9fc1f5">回線コンパス</text>
</svg>
