<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="用途別に必要なインターネット速度の目安" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="56" text-anchor="middle" font-size="38" font-weight="800" fill="#0b2c5f">用途別・必要な速度の目安</text>
  <text x="600" y="94" text-anchor="middle" font-size="22" fill="#5f6b7a">「混雑する夜の時間帯」にこの速度が出るかがポイント</text>

  <!-- バー共通: x=340起点, 幅max 760 (100Mbps=760px スケールは非線形表示) -->
  <g font-size="22" fill="#26303e">
    <!-- メール/SNS -->
    <text x="320" y="168" text-anchor="end" font-weight="700">メール・SNS</text>
    <rect x="340" y="146" width="76" height="34" rx="17" fill="#9fc1f5"/>
    <text x="432" y="171" font-size="19" fill="#5f6b7a">〜1Mbps</text>

    <!-- Web閲覧 -->
    <text x="320" y="238" text-anchor="end" font-weight="700">Webサイト閲覧</text>
    <rect x="340" y="216" width="140" height="34" rx="17" fill="#9fc1f5"/>
    <text x="496" y="241" font-size="19" fill="#5f6b7a">〜10Mbps</text>

    <!-- 動画HD -->
    <text x="320" y="308" text-anchor="end" font-weight="700">動画視聴(HD)</text>
    <rect x="340" y="286" width="200" height="34" rx="17" fill="#4b8bf5"/>
    <text x="556" y="311" font-size="19" fill="#5f6b7a">5〜10Mbps</text>

    <!-- Web会議 -->
    <text x="320" y="378" text-anchor="end" font-weight="700">Web会議</text>
    <rect x="340" y="356" width="300" height="34" rx="17" fill="#1558d6"/>
    <text x="656" y="381" font-size="19" fill="#5f6b7a">上下10〜15Mbps <tspan font-weight="800" fill="#b8482c">※上りが重要</tspan></text>

    <!-- 4K動画 -->
    <text x="320" y="448" text-anchor="end" font-weight="700">4K動画・大容量DL</text>
    <rect x="340" y="426" width="420" height="34" rx="17" fill="#1558d6"/>
    <text x="776" y="451" font-size="19" fill="#5f6b7a">25Mbps〜</text>

    <!-- ゲーム -->
    <text x="320" y="518" text-anchor="end" font-weight="700">オンラインゲーム</text>
    <rect x="340" y="496" width="560" height="34" rx="17" fill="#0b2c5f"/>
    <text x="916" y="521" font-size="19" fill="#5f6b7a">100Mbps〜 + 低Ping</text>
  </g>

  <rect x="240" y="560" width="720" height="46" rx="23" fill="#eaf1fd" stroke="#c3d7f7" stroke-width="2"/>
  <text x="600" y="591" text-anchor="middle" font-size="20" font-weight="800" fill="#0f43a8">光回線なら全用途を余裕でカバーできる(実測数百Mbpsが標準)</text>
</svg>
