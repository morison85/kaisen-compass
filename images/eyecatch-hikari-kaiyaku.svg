<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="光回線の解約手順と違約金" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <g transform="translate(930, 250)">
    <rect x="0" y="20" width="210" height="170" rx="14" fill="#ffffff"/>
    <rect x="0" y="20" width="210" height="42" rx="14" fill="#9fc1f5"/>
    <rect x="26" y="86" width="158" height="10" rx="5" fill="#cfe0ff"/>
    <rect x="26" y="116" width="110" height="10" rx="5" fill="#cfe0ff"/>
    <circle cx="168" cy="152" r="34" fill="#ffd76a"/>
    <path d="M154 152 L164 163 L184 141" fill="none" stroke="#0b2c5f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="70" y="80" width="276" height="56" rx="28" fill="#ffd76a"/>
  <text x="208" y="119" text-anchor="middle" font-size="27" font-weight="800" fill="#0b2c5f">順番を間違えない</text>

  <text x="70" y="248" font-size="70" font-weight="800" fill="#ffffff">光回線の解約</text>
  <text x="70" y="360" font-size="66" font-weight="800" fill="#ffd76a">手順と違約金</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">無回線期間を作らないための段取り</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
