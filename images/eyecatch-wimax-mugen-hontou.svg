<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="WiMAXの無制限に制限がかかる3つの条件" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2c5f"/>
      <stop offset=".55" stop-color="#114699"/>
      <stop offset="1" stop-color="#1558d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="180" fill="#ffffff" opacity=".05"/>
  <circle cx="1080" cy="600" r="140" fill="#ffffff" opacity=".05"/>

  <!-- 右下:電波塔と虫めがね -->
  <g transform="translate(900, 325) scale(0.9)">
    <path d="M140 90 L96 244 H184 Z" fill="#ffffff"/>
    <rect x="112" y="184" width="56" height="14" fill="#9fc1f5"/>
    <circle cx="140" cy="70" r="16" fill="#ffd76a"/>
    <path d="M92 46 A66 66 0 0 0 92 94" fill="none" stroke="#ffd76a" stroke-width="11" stroke-linecap="round"/>
    <path d="M188 46 A66 66 0 0 1 188 94" fill="none" stroke="#ffd76a" stroke-width="11" stroke-linecap="round"/>
    <circle cx="212" cy="222" r="50" fill="none" stroke="#ffd76a" stroke-width="14"/>
    <path d="M248 258 L282 292" stroke="#ffd76a" stroke-width="18" stroke-linecap="round"/>
    <text x="212" y="240" text-anchor="middle" font-size="46" font-weight="800" fill="#ffffff">?</text>
  </g>

  <rect x="70" y="80" width="292" height="56" rx="28" fill="#ffd76a"/>
  <text x="216" y="119" text-anchor="middle" font-size="29" font-weight="800" fill="#0b2c5f">4つの層に分けて整理</text>

  <text x="70" y="248" font-size="78" font-weight="800" fill="#ffffff">WiMAXの無制限は</text>
  <text x="70" y="360" font-size="78" font-weight="800" fill="#ffd76a">本当か?</text>
  <text x="70" y="436" font-size="31" font-weight="600" fill="#cfe0ff">制限が残る3つの条件と、使い方別の安全ライン</text>

  <g transform="translate(70,530)">
    <circle cx="24" cy="24" r="24" fill="#ffffff"/>
    <polygon points="24,8 29,24 24,40 19,24" fill="#1558d6"/>
    <circle cx="24" cy="24" r="3.5" fill="#0b2c5f"/>
    <text x="62" y="34" font-size="30" font-weight="800" fill="#ffffff">回線コンパス</text>
  </g>
</svg>
